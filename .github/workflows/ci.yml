name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Spotless, unit tests + ArchUnit (Surefire), Testcontainers ITs (Failsafe), JaCoCo check.
      - name: Verify
        run: ./mvnw -B verify

      - name: Test summary
        if: always()
        run: scripts/test-summary.sh --no-build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Build ledger-service image
        run: docker build -f ledger-service/Dockerfile -t ledgerflow/ledger-service:ci .
