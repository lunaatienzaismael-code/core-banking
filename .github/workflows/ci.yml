name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # Full history with tags: the Avro compatibility check reads schemas at the last release tag (ADR 0013).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Spotless, unit tests + ArchUnit (Surefire), Testcontainers ITs (Failsafe), JaCoCo check.
      - name: Verify
        run: ./mvnw -B verify

      - name: Test summary
        if: always()
        run: scripts/test-summary.sh --no-build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  # Separate from "Build and test" so a mutation failure never hides a test failure (ADR 0003).
  mutation:
    name: Mutation testing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history with tags: the Avro compatibility check reads schemas at the last release tag (ADR 0013).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests only (no Docker); PIT on domain + application, threshold in the parent POM.
      - name: Mutation coverage
        run: ./mvnw -B verify -Pmutation -DskipITs -Djacoco.skip=true

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-reports
          path: "**/target/pit-reports/"
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Build ledger-service image
        run: docker build -f ledger-service/Dockerfile -t ledgerflow/ledger-service:ci .
      - name: Build payment-service image
        run: docker build -f payment-service/Dockerfile -t ledgerflow/payment-service:ci .

  # Both services as Docker images (T-032); its own job so "Build and test" keeps its time.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      # Full history with tags: -am builds messaging-contracts, whose compatibility check reads the last release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Each image built once, its layers cached across runs, under the tags the tests use (as scripts/e2e.sh does locally).
      - uses: docker/setup-buildx-action@v4

      - name: Build ledger-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ledger-service/Dockerfile
          tags: ledgerflow/ledger-service:e2e
          load: true
          cache-from: type=gha,scope=ledger-service
          cache-to: type=gha,mode=max,scope=ledger-service

      - name: Build payment-service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: payment-service/Dockerfile
          tags: ledgerflow/payment-service:e2e
          load: true
          cache-from: type=gha,scope=payment-service
          cache-to: type=gha,mode=max,scope=payment-service

      - name: End-to-end tests
        run: ./mvnw -B verify -Pe2e -pl e2e-tests -am

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-reports
          path: e2e-tests/target/failsafe-reports/
          retention-days: 7
