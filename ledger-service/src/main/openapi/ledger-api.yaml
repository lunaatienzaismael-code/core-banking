openapi: 3.1.0
info:
  title: LedgerFlow Ledger API
  version: 0.1.0
  description: |
    Double-entry ledger: accounts, balances derived from postings, and movements.
    Amounts are integer minor units with an ISO-4217 currency code (ADR 0004).
    Errors use Problem Details (RFC 9457). All example data is fictitious.
servers:
  - url: http://localhost:8080
    description: Local development
paths: {}
components:
  schemas:
    Problem:
      description: Problem Details for HTTP APIs (RFC 9457).
      type: object
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference identifying this occurrence.
      example:
        type: about:blank
        title: Not Found
        status: 404
        detail: Account 3f1c2b7e-0000-4000-8000-000000000001 does not exist
        instance: /accounts/3f1c2b7e-0000-4000-8000-000000000001/balance
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
