openapi: 3.1.0
info:
  title: LedgerFlow Ledger API
  version: 0.1.0
  description: |
    Double-entry ledger: accounts, balanced transactions, balances from
    postings, and movements.
    Amounts are integer minor units with an ISO-4217 currency code (ADR 0004).
    Errors use Problem Details (RFC 9457). All example data is fictitious.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Accounts
    description: Ledger accounts and their balances.
  - name: Transactions
    description: Double-entry transactions between accounts.
paths:
  /accounts:
    post:
      tags: [Accounts]
      operationId: openAccount
      summary: Open an account
      description: |
        Opens an account in one currency. The account type fixes its normal
        balance side; a new account has a zero balance and no movements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: Account opened.
          headers:
            Location:
              description: URI of the new account.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
  /accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get an account's balance
      description: |
        Balance from the account's posting counters, which always equal the
        sums of its postings (ADR 0009), reported from its normal balance
        side: Σ debits − Σ credits for a debit-normal account, Σ credits −
        Σ debits for a credit-normal one.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account's current balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /accounts/{accountId}/movements:
    get:
      tags: [Accounts]
      operationId: getAccountMovements
      summary: List an account's movements
      description: |
        Every posting line of the account, oldest first (transaction time, then
        posting id). Amounts are unsigned; `direction` says debit or credit.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account's movements; empty for an account without postings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMovements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /transactions:
    post:
      tags: [Transactions]
      operationId: recordTransaction
      summary: Record a double-entry transaction
      description: |
        Records a transaction whose debit lines equal its credit lines, all in
        one currency and each in its account's currency. The transaction, its
        postings and the accounts' balances are written atomically, or nothing
        is (UC2, ADR 0009).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordTransactionRequest'
      responses:
        '201':
          description: Transaction recorded.
          headers:
            Location:
              description: URI of the new transaction.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: Account identifier.
      schema:
        type: string
        format: uuid
  schemas:
    CurrencyCode:
      description: ISO-4217 alphabetic currency code.
      type: string
      pattern: '^[A-Z]{3}$'
      example: EUR
    AccountType:
      description: |
        Accounting classification. ASSET and EXPENSE are debit-normal;
        LIABILITY, EQUITY and INCOME are credit-normal. A customer deposit
        account is a LIABILITY of the bank.
      type: string
      enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE]
    Side:
      description: Side of double-entry bookkeeping.
      type: string
      enum: [DEBIT, CREDIT]
    OverdraftPolicy:
      description: Whether the balance may go below zero on the account's normal side.
      type: string
      enum: [ALLOWED, NOT_ALLOWED]
    Money:
      description: Exact amount in integer minor units (e.g. cents) of an ISO-4217 currency.
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          example: 0
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    OpenAccountRequest:
      type: object
      required: [currency, type, overdraftPolicy]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        type:
          $ref: '#/components/schemas/AccountType'
        overdraftPolicy:
          $ref: '#/components/schemas/OverdraftPolicy'
      example:
        currency: EUR
        type: LIABILITY
        overdraftPolicy: NOT_ALLOWED
    Account:
      type: object
      required: [id, currency, type, normalBalanceSide, overdraftPolicy, balance]
      properties:
        id:
          type: string
          format: uuid
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        type:
          $ref: '#/components/schemas/AccountType'
        normalBalanceSide:
          $ref: '#/components/schemas/Side'
        overdraftPolicy:
          $ref: '#/components/schemas/OverdraftPolicy'
        balance:
          $ref: '#/components/schemas/Money'
      example:
        id: 3f1c2b7e-0000-4000-8000-000000000001
        currency: EUR
        type: LIABILITY
        normalBalanceSide: CREDIT
        overdraftPolicy: NOT_ALLOWED
        balance: {amount: 0, currency: EUR}
    AccountBalance:
      type: object
      required: [accountId, normalBalanceSide, balance]
      properties:
        accountId:
          type: string
          format: uuid
        normalBalanceSide:
          $ref: '#/components/schemas/Side'
        balance:
          $ref: '#/components/schemas/Money'
      example:
        accountId: 3f1c2b7e-0000-4000-8000-000000000001
        normalBalanceSide: CREDIT
        balance: {amount: 12500, currency: EUR}
    Movement:
      description: One posting line of an account.
      type: object
      required: [postingId, transactionId, amount, direction, occurredAt]
      properties:
        postingId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
          description: The ledger transaction this posting line belongs to.
        amount:
          $ref: '#/components/schemas/Money'
        direction:
          $ref: '#/components/schemas/Side'
        occurredAt:
          type: string
          format: date-time
    AccountMovements:
      type: object
      required: [accountId, movements]
      properties:
        accountId:
          type: string
          format: uuid
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
      example:
        accountId: 3f1c2b7e-0000-4000-8000-000000000001
        movements:
          - postingId: 9b2d4e10-0000-4000-8000-000000000101
            transactionId: 5a7c1f22-0000-4000-8000-000000000201
            amount: {amount: 10000, currency: EUR}
            direction: CREDIT
            occurredAt: '2026-01-15T09:30:00Z'
    PositiveMoney:
      description: A strictly positive amount; the direction of a line says debit or credit.
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          example: 2500
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    TransactionLineRequest:
      type: object
      required: [accountId, amount, direction]
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        direction:
          $ref: '#/components/schemas/Side'
    RecordTransactionRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/TransactionLineRequest'
      example:
        lines:
          - accountId: 3f1c2b7e-0000-4000-8000-000000000002
            amount: {amount: 2500, currency: EUR}
            direction: DEBIT
          - accountId: 3f1c2b7e-0000-4000-8000-000000000001
            amount: {amount: 2500, currency: EUR}
            direction: CREDIT
    TransactionLine:
      description: One posting line of a transaction.
      type: object
      required: [postingId, accountId, amount, direction]
      properties:
        postingId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        direction:
          $ref: '#/components/schemas/Side'
    Transaction:
      type: object
      required: [id, occurredAt, lines]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TransactionLine'
      example:
        id: 5a7c1f22-0000-4000-8000-000000000201
        occurredAt: '2026-01-15T09:30:00Z'
        lines:
          - postingId: 9b2d4e10-0000-4000-8000-000000000101
            accountId: 3f1c2b7e-0000-4000-8000-000000000002
            amount: {amount: 2500, currency: EUR}
            direction: DEBIT
          - postingId: 9b2d4e10-0000-4000-8000-000000000102
            accountId: 3f1c2b7e-0000-4000-8000-000000000001
            amount: {amount: 2500, currency: EUR}
            direction: CREDIT
    Problem:
      description: Problem Details for HTTP APIs (RFC 9457).
      type: object
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference identifying this occurrence.
      example:
        type: about:blank
        title: Not Found
        status: 404
        detail: Account 3f1c2b7e-0000-4000-8000-000000000001 does not exist
        instance: /accounts/3f1c2b7e-0000-4000-8000-000000000001/balance
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: |
        Well-formed but breaks a ledger rule: unbalanced lines, mixed
        currencies, a line in a currency other than its account's, or two
        lines on one account.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unbalanced transaction
            status: 422
            detail: 'Transaction 5a7c1f22-0000-4000-8000-000000000201 is unbalanced: its lines sum to 100 EUR instead of zero'
            instance: /transactions
