spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5433/payment}
    username: ${PAYMENT_DB_USER:payment}
    password: ${PAYMENT_DB_PASSWORD:payment}
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks that the mappings match it.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${PAYMENT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # For every client: producers register schemas, consumers look them up.
    properties:
      schema.registry.url: ${PAYMENT_SCHEMA_REGISTRY_URL:http://localhost:8085}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        # Several message types share a topic, so subjects are per topic and type (ADR 0013).
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A payload that cannot be read reaches the error handler, which parks it on the DLT (ADR 0013).
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
  jackson:
    # Optional fields the contract marks as absent (e.g. a payment's reason) are left out, never sent as null.
    default-property-inclusion: non_null

# 8080 is the ledger's, so both services run side by side locally.
server:
  port: ${PAYMENT_PORT:8081}

# Transactional outbox relay and consumer retries (ADR 0013).
ledgerflow:
  kafka:
    retry:
      max-retries: 3
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 5s
  outbox:
    relay-interval: 500ms
    batch-size: 100
    send-timeout: 10s
    # Any constant unique among the services sharing a database server; "PAYM" in ASCII.
    lock-key: 1346459981

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
