# Local dependencies only (ADR 0007). Services run from the IDE or with
# ./mvnw -pl ledger-service spring-boot:run
#
#   docker compose -f infra/docker-compose.yml up -d
name: ledgerflow

services:
  ledger-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ledger-db-data:
